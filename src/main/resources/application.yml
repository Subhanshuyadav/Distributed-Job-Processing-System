spring:
  application:
    name: distributed-job-processing

  datasource:
    url: jdbc:postgresql://localhost:5432/jobdb
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: 'Subh@2004'

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:
      mode: always

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      enable-auto-commit: false

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics